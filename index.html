<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time camera optical flow and interactive motion visualization using WebGPU compute shaders.">
  <title>Real-Time Optical Flow — WebGPU</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #09090d;
      color: #e0e0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 1.2rem 0 0.3rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #71717a;
      margin-bottom: 1rem;
    }

    #start-btn, #stop-btn {
      padding: 0.65rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #start-btn {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.35);
      margin-bottom: 1rem;
    }

    #start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(124, 58, 237, 0.55);
    }

    #stop-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
      display: none;
    }

    #stop-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.55);
    }

    #start-btn:disabled, #stop-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
      display: none;
      max-width: 600px;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Mode Switcher Tab Bar ───────────────────────────────────────── */
    .mode-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      padding: 0.25rem;
      gap: 0.25rem;
      margin-bottom: 1rem;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0.45rem 1.1rem;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .mode-btn:hover {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.06);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }

    /* ── Canvas Container ────────────────────────────────────────────── */
    .canvas-container {
      position: relative;
      width: 960px;
      max-width: 95vw;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #0f0f15;
    }

    .canvas-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #arrow-canvas {
      pointer-events: none;
      z-index: 2;
    }

    #gpu-canvas {
      z-index: 1;
    }

    #video-canvas {
      z-index: 0;
    }

    /* ── Compass Widget Overlay ──────────────────────────────────────── */
    .compass-overlay {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      background: rgba(15, 15, 23, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.5rem 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .compass-dial {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      position: relative;
      background: conic-gradient(
        from 0deg,
        #f43f5e, #ec4899, #a855f7, #6366f1, #38bdf8, #10b981, #eab308, #f43f5e
      );
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }

    .compass-dial::after {
      content: '';
      position: absolute;
      top: 5px; left: 5px; right: 5px; bottom: 5px;
      background: #0f0f15;
      border-radius: 50%;
    }

    .compass-needle {
      position: absolute;
      width: 2px;
      height: 12px;
      background: #ffffff;
      top: 50%; left: 50%;
      transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(0deg);
      border-radius: 2px;
      z-index: 2;
      transition: transform 0.1s ease;
      box-shadow: 0 0 4px #ffffff;
    }

    /* ── Controls Row ────────────────────────────────────────────────── */
    .controls {
      display: flex;
      gap: 1.2rem;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }

    .control-group label {
      color: #94a3b8;
      font-weight: 500;
    }

    .control-group input[type="range"] {
      width: 90px;
      accent-color: #818cf8;
      cursor: pointer;
    }

    .sim-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .sim-toggle:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* ── HUD Stats ───────────────────────────────────────────────────── */
    .hud {
      display: flex;
      gap: 1.2rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hud-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .hud-item .label {
      color: #64748b;
      margin-right: 0.4rem;
    }

    .hud-item .value {
      color: #38bdf8;
      font-weight: 600;
    }

    #camera-video {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Real-Time Optical Flow</h1>
  <p class="subtitle">WebGPU Compute Flow Field · Interactive Motion Visualizer</p>

  <div id="error-msg"></div>

  <div style="display: flex; gap: 0.8rem; margin-bottom: 0.8rem;">
    <button id="start-btn">Start Camera</button>
    <button id="stop-btn">Stop Camera</button>
  </div>

  <!-- Mode Switcher Tabs -->
  <div class="mode-bar" id="mode-bar" style="display: none;">
    <button class="mode-btn active" data-mode="particles">✨ Magical Particles</button>
    <button class="mode-btn" data-mode="streamlines">🌊 Streamlines</button>
    <button class="mode-btn" data-mode="thermal">🔥 Thermal Glow</button>
    <button class="mode-btn" data-mode="arrows">🎯 Quiver Arrows</button>
  </div>

  <div class="canvas-container">
    <canvas id="video-canvas"></canvas>
    <canvas id="gpu-canvas"></canvas>
    <canvas id="arrow-canvas"></canvas>

    <!-- Circular Motion Compass HUD -->
    <div class="compass-overlay" id="compass-overlay">
      <div class="compass-dial">
        <div class="compass-needle" id="compass-needle"></div>
      </div>
      <div>
        <div style="font-weight:600;color:#f8fafc;" id="compass-label">Motion HUD</div>
        <div style="font-size:0.7rem;color:#64748b;" id="compass-speed">0.0 px/f</div>
      </div>
    </div>
  </div>

  <!-- Controls Row -->
  <div class="controls" id="controls" style="display: none;">
    <div class="control-group">
      <label for="intensity-slider">Intensity</label>
      <input type="range" id="intensity-slider" min="10" max="100" value="80">
    </div>
    <div class="control-group">
      <button class="sim-toggle" id="sim-btn">Test Motion Target</button>
    </div>
  </div>

  <!-- HUD Stats -->
  <div class="hud">
    <div class="hud-item"><span class="label">FPS</span><span class="value" id="fps-value">—</span></div>
    <div class="hud-item"><span class="label">Flow Time</span><span class="value" id="flow-time">—</span></div>
    <div class="hud-item"><span class="label">Resolution</span><span class="value" id="res-value">—</span></div>
  </div>

  <video id="camera-video" autoplay muted playsinline></video>

  <script type="module" src="src/main.js"></script>
</body>
</html>
