<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time camera optical flow and motion vector visualization using WebGPU compute shaders.">
  <title>Real-Time Optical Flow — WebGPU</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
      background: linear-gradient(135deg, #6ee7b7, #3b82f6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 1.2rem;
    }

    #start-btn {
      padding: 0.7rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
      margin-bottom: 1.2rem;
    }

    #start-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5);
    }

    #start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
      display: none;
      max-width: 600px;
      text-align: center;
      line-height: 1.5;
    }

    .canvas-container {
      position: relative;
      width: 960px;
      max-width: 95vw;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: #111118;
    }

    .canvas-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #arrow-canvas {
      pointer-events: none;
      z-index: 2;
    }

    #gpu-canvas {
      z-index: 1;
    }

    .hud {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hud-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .hud-item .label {
      color: #6b7280;
      margin-right: 0.4rem;
    }

    .hud-item .value {
      color: #a78bfa;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }

    .control-group label {
      color: #9ca3af;
    }

    .control-group select,
    .control-group input[type="range"] {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #e0e0e8;
      padding: 0.3rem 0.5rem;
      font-size: 0.8rem;
    }

    .control-group input[type="range"] {
      width: 80px;
      accent-color: #6366f1;
    }

    #camera-video {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Real-Time Optical Flow</h1>
  <p class="subtitle">WebGPU compute shaders · block-matching · HSV heatmap</p>

  <div id="error-msg"></div>

  <button id="start-btn">Start Camera</button>

  <div class="controls" id="controls" style="display: none;">
    <div class="control-group">
      <label for="heatmap-opacity">Heatmap</label>
      <input type="range" id="heatmap-opacity" min="0" max="100" value="60">
    </div>
    <div class="control-group">
      <label for="arrows-toggle">Arrows</label>
      <select id="arrows-toggle">
        <option value="on">On</option>
        <option value="off">Off</option>
      </select>
    </div>
    <div class="control-group">
      <label for="resolution-select">Resolution</label>
      <select id="resolution-select">
        <option value="480">480×270</option>
        <option value="320">320×180</option>
      </select>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gpu-canvas"></canvas>
    <canvas id="arrow-canvas"></canvas>
  </div>

  <div class="hud">
    <div class="hud-item"><span class="label">FPS</span><span class="value" id="fps-value">—</span></div>
    <div class="hud-item"><span class="label">Flow</span><span class="value" id="flow-time">—</span></div>
    <div class="hud-item"><span class="label">Resolution</span><span class="value" id="res-value">—</span></div>
  </div>

  <video id="camera-video" autoplay muted playsinline></video>

  <script type="module" src="src/main.js"></script>
</body>
</html>
